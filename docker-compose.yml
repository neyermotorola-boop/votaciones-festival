services:
  app:
    build: .
    container_name: votaciones_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: votaciones
      DB_USERNAME: votaciones
      DB_PASSWORD: secret
      SEED_DEMO: "true"
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: votaciones_db
    environment:
      MYSQL_DATABASE: votaciones
      MYSQL_USER: votaciones
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: votaciones_pma
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  dbdata:
