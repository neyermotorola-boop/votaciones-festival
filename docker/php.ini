; Ajustes de rendimiento para el contenedor de la aplicación.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; En desarrollo revisa cambios cada 2 s; en producción pon OPCACHE_VALIDATE=0.
opcache.validate_timestamps=${OPCACHE_VALIDATE}
opcache.revalidate_freq=2

realpath_cache_size=4096K
realpath_cache_ttl=600

; Subida de fotos de participantes.
upload_max_filesize=4M
post_max_size=8M
memory_limit=256M
expose_php=Off
